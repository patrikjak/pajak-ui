<html><body>
<aside class="pajak-sb--workspace pajak-sb">
    <script>
        (function () {
            try {
                var aside = document.currentScript.closest('.pajak-sb');
                if (!aside) return;
                var dialog = aside.closest('dialog[data-pajak-sidebar]');
                var id = (dialog && dialog.id) || aside.id;
                if (id && localStorage.getItem('pajak-sb-rail:' + id) === '1') {
                    aside.classList.add('pajak-sb--rail');
                }
            } catch (e) {}
        })();
    </script>
            <div class="pajak-sb__brand">
            App
            <button class="pajak-sb-toggle pajak-sb-toggle--close" data-pajak-sidebar-close aria-label="Close navigation">
                <span class="pajak-sb-toggle__icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
        </div>
    
            <div class="pajak-sb__header">Workspace switcher</div>
    
            <div class="pajak-sb__scroll"><div class="pajak-sb-item-wrap">
    <a class="is-active pajak-sb-item" href="/" aria-current="page">
        
        <span class="pajak-sb-item__label">Overview</span>

        
        
        <span class="pajak-sb-item__tooltip" aria-hidden="true">Overview</span>
    </a>

    </div></div>

</body></html>
