<html><body>
<aside class="pajak-sb--dark pajak-sb">
    <script>
        (function () {
            try {
                var dialog = document.currentScript.closest('dialog[data-pajak-sidebar]');
                if (dialog && dialog.id) {
                    var saved = localStorage.getItem('pajak-sb-rail:' + dialog.id);
                    var aside = dialog.querySelector('.pajak-sb');
                    if (aside && saved === '1') {
                        aside.classList.add('pajak-sb--rail');
                    }
                }
            } catch (e) {}
        })();
    </script>
            <button class="pajak-sb-toggle pajak-sb-toggle--close" data-pajak-sidebar-close aria-label="Close navigation">
            <span class="pajak-sb-toggle__icon">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>
    
    
    
    </aside>
</body></html>
