<html><body>
<div data-pajak-otp="" data-numeric="true" data-autosubmit="false" class="pajak-field">
    <label class="pajak-field__label" id="code-label" for="code-digit-1">PIN</label>

    <div class="pajak-otp" role="group" aria-labelledby="code-label">
                    <input class="pajak-otp__box pajak-otp__box--lg" type="text" id="code-digit-1" autocomplete="one-time-code" aria-label="Digit 1 of 4" inputmode="numeric" pattern="[0-9]*">
                    <input class="pajak-otp__box pajak-otp__box--lg" type="text" id="code-digit-2" autocomplete="off" aria-label="Digit 2 of 4" inputmode="numeric" pattern="[0-9]*">
                    <input class="pajak-otp__box pajak-otp__box--lg" type="text" id="code-digit-3" autocomplete="off" aria-label="Digit 3 of 4" inputmode="numeric" pattern="[0-9]*">
                    <input class="pajak-otp__box pajak-otp__box--lg" type="text" id="code-digit-4" autocomplete="off" aria-label="Digit 4 of 4" inputmode="numeric" pattern="[0-9]*">
        
        <input type="hidden" name="code">
    </div>

    </div>
</body></html>
