<html><body>
<div data-pajak-otp="" data-numeric="true" data-autosubmit="false" class="pajak-field">
    <label class="pajak-field__label" id="code-label" for="code-digit-1">Verification code</label>

    <div class="pajak-otp" role="group" aria-labelledby="code-label">
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-1" autocomplete="one-time-code" aria-label="Digit 1 of 6" inputmode="numeric" pattern="[0-9]*" autofocus disabled>
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-2" autocomplete="off" aria-label="Digit 2 of 6" inputmode="numeric" pattern="[0-9]*" disabled>
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-3" autocomplete="off" aria-label="Digit 3 of 6" inputmode="numeric" pattern="[0-9]*" disabled>
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-4" autocomplete="off" aria-label="Digit 4 of 6" inputmode="numeric" pattern="[0-9]*" disabled>
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-5" autocomplete="off" aria-label="Digit 5 of 6" inputmode="numeric" pattern="[0-9]*" disabled>
                    <input class="pajak-otp__box pajak-otp__box--md" type="text" id="code-digit-6" autocomplete="off" aria-label="Digit 6 of 6" inputmode="numeric" pattern="[0-9]*" disabled>
        
        <input type="hidden" name="code" disabled>
    </div>

    </div>
</body></html>
